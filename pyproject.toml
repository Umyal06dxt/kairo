[project]
name = "kairo"
version = "0.1.0"
description = "Voice-enabled speculative RAG (dual-agent Slow Thinker / Fast Talker)"
requires-python = ">=3.10"
dependencies = ["numpy", "faiss-cpu", "openai"]

[project.optional-dependencies]
openai = ["openai"]
qdrant = ["qdrant-client"]
voice = ["faster-whisper", "edge-tts", "av"]
local = ["fastembed"]
web = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "pytest-asyncio", "qdrant-client", "httpx", "fastembed", "fastapi", "uvicorn[standard]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
kairo = "kairo.cli:main"

[tool.setuptools.package-data]
kairo = ["server/static/*"]
